{% if pagination.pages > 1 %}<nav class="pagination" aria-label="Results pages">
    {% if pagination.page > 1 %}<a href="?page={{ pagination.page - 1 }}&page_size={{ pagination.page_size }}{% if filters.q is defined %}&q={{ filters.q }}{% endif %}{% if filters.category is defined %}&category={{ filters.category }}{% endif %}{% if filters.classification is defined %}&classification={{ filters.classification }}{% endif %}{% if filters.owner is defined %}&owner={{ filters.owner }}{% endif %}{% if filters.applies_to is defined %}&applies_to={{ filters.applies_to }}{% endif %}{% if filters.faculty is defined %}&faculty={{ filters.faculty }}&department={{ filters.department }}&program={{ filters.program }}&semester={{ filters.semester }}&batch={{ filters.batch }}&status={{ filters.status }}{% endif %}">Previous</a>{% endif %}
    <span>Page {{ pagination.page }} of {{ pagination.pages }}</span>
    {% if pagination.page < pagination.pages %}<a href="?page={{ pagination.page + 1 }}&page_size={{ pagination.page_size }}{% if filters.q is defined %}&q={{ filters.q }}{% endif %}{% if filters.category is defined %}&category={{ filters.category }}{% endif %}{% if filters.classification is defined %}&classification={{ filters.classification }}{% endif %}{% if filters.owner is defined %}&owner={{ filters.owner }}{% endif %}{% if filters.applies_to is defined %}&applies_to={{ filters.applies_to }}{% endif %}{% if filters.faculty is defined %}&faculty={{ filters.faculty }}&department={{ filters.department }}&program={{ filters.program }}&semester={{ filters.semester }}&batch={{ filters.batch }}&status={{ filters.status }}{% endif %}">Next</a>{% endif %}
</nav>{% endif %}
