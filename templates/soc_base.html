<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | LLMGuard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='product.css') }}?v={{ asset_version }}">
    <link rel="stylesheet" href="{{ url_for('static', path='portal.css') }}?v={{ asset_version }}">
    <link rel="stylesheet" href="{{ url_for('static', path='security_dashboard.css') }}?v={{ asset_version }}">
</head>
<body class="product-body security-body am-tech-shell llmg-shell llmg-cyber-bg">
    {% include "components/product_nav.html" %}
    <main class="product-page">
        <div class="portal-shell">
            {% include "components/admin_sidebar.html" %}
            <div class="portal-main soc-console">
                {% include "components/soc_subnav.html" %}
                {% block soc_content %}{% endblock %}
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', path='product.js') }}?v={{ asset_version }}" defer></script>
</body>
</html>
