<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='product.css') }}?v={{ asset_version }}">
    <link rel="stylesheet" href="{{ url_for('static', path='console.css') }}?v={{ asset_version }}">
</head>
<body class="product-body reference-login-body">
    <main class="reference-login-shell">
        <div class="login-radar" aria-hidden="true"></div>
        <div class="reference-login-composition">
            <p class="login-environment-note">
                <svg aria-hidden="true"><use href="/static/llmguard-icons.svg#shield"></use></svg>
                Controlled Research Environment
            </p>
            <section class="reference-login-card" aria-labelledby="login-heading">
                <div class="reference-login-intro">
                    <div class="reference-login-icon" aria-hidden="true"><svg><use href="/static/llmguard-icons.svg#shield"></use></svg></div>
                    <h1>LLMGuard</h1>
                    <p>AI Security Firewall</p>
                </div>
                <h2 id="login-heading">Administrator Sign In</h2>
                <form id="login-form">
                    <div class="login-field">
                        <label for="username">Username</label>
                        <div class="login-input-wrap">
                            <svg aria-hidden="true"><use href="/static/llmguard-icons.svg#employee"></use></svg>
                            <input id="username" name="username" type="text" autocomplete="username" required>
                        </div>
                    </div>
                    <div class="login-field">
                        <label for="password">Password</label>
                        <div class="login-input-wrap">
                            <svg aria-hidden="true"><use href="/static/llmguard-icons.svg#lock"></use></svg>
                            <input id="password" name="password" type="password" autocomplete="current-password" required>
                        </div>
                    </div>
                    <button class="primary-button" type="submit">Sign In to Security Console</button>
                    <p class="form-message" id="login-message" role="status" aria-live="polite" aria-atomic="true"></p>
                </form>
                <p class="login-access-note">Restricted administrative access.</p>
            </section>
        </div>
    </main>
    <script src="{{ url_for('static', path='product.js') }}?v={{ asset_version }}" defer></script>
</body>
</html>
